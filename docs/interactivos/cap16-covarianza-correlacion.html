<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Covarianza y correlación</title><style>body{font-family:system-ui;margin:0;background:#f7f9fc;color:#182230}.wrap{max-width:980px;margin:auto;padding:18px}.panel{background:white;border:1px solid #dbe3ec;border-radius:14px;padding:16px}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}canvas{width:100%;height:420px;border:1px solid #e3e8ef;border-radius:10px;background:white}.stat{padding:8px 12px;background:#eef4fb;border-radius:9px}label{font-weight:600}input{width:260px}button{padding:8px 12px}</style></head><body><div class="wrap"><div class="panel"><h2>Covarianza, correlación y dependencia</h2><div class="row"><label>Modo <select id="modo"><option value="lineal">Lineal</option><option value="parabola">No lineal: Y=X²</option></select></label><label>ρ <input id="rho" type="range" min="-0.95" max="0.95" step="0.05" value="0.70"><span id="rv">0.70</span></label><button id="nuevo">Nueva muestra</button></div><p>En modo lineal, mueve ρ. En modo no lineal observa que puede existir dependencia muy fuerte aunque la correlación sea cercana a cero.</p><div class="row"><div class="stat">Covarianza: <b id="cov"></b></div><div class="stat">Correlación: <b id="cor"></b></div></div><canvas id="c" width="900" height="420"></canvas></div></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d'),rho=document.getElementById('rho'),rv=document.getElementById('rv'),modo=document.getElementById('modo');function normal(){let u=1-Math.random(),v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}function stats(x,y){let n=x.length,mx=x.reduce((a,b)=>a+b,0)/n,my=y.reduce((a,b)=>a+b,0)/n,c=0,vx=0,vy=0;for(let i=0;i<n;i++){let a=x[i]-mx,b=y[i]-my;c+=a*b;vx+=a*a;vy+=b*b}c/=n;vx/=n;vy/=n;return[c,c/Math.sqrt(vx*vy)]}function draw(){let x=[],y=[],r=+rho.value;rv.textContent=r.toFixed(2);for(let i=0;i<700;i++){if(modo.value==='lineal'){let a=normal(),b=normal();x.push(a);y.push(r*a+Math.sqrt(1-r*r)*b)}else{let a=2*Math.random()-1;x.push(a);y.push(a*a)}}let sx=stats(x,y);document.getElementById('cov').textContent=sx[0].toFixed(3);document.getElementById('cor').textContent=sx[1].toFixed(3);ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#c7d0da';ctx.beginPath();ctx.moveTo(c.width/2,0);ctx.lineTo(c.width/2,c.height);ctx.moveTo(0,c.height/2);ctx.lineTo(c.width,c.height/2);ctx.stroke();ctx.fillStyle='#2266aa';for(let i=0;i<x.length;i++){let px,py;if(modo.value==='lineal'){px=c.width/2+x[i]*95;py=c.height/2-y[i]*75}else{px=c.width/2+x[i]*350;py=c.height-35-y[i]*330}ctx.beginPath();ctx.arc(px,py,2.5,0,2*Math.PI);ctx.fill()}}rho.oninput=draw;modo.onchange=()=>{rho.disabled=modo.value!=='lineal';draw()};document.getElementById('nuevo').onclick=draw;draw()</script></body></html>
