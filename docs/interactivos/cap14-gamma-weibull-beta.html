<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gamma, Weibull y Beta</title><style>body{font-family:system-ui;margin:18px;background:#fafafa;color:#222}h2{margin-top:0}.row{display:flex;gap:16px;flex-wrap:wrap}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:14px;flex:1;min-width:260px}.controls label{display:block;margin:.5rem 0}.stats{font-size:.95rem;line-height:1.5}canvas{width:100%;height:320px;border:1px solid #eee;border-radius:10px;background:white}select,input{width:100%}</style></head><body><h2>Distribuciones Gamma, Weibull y Beta</h2><div class="row"><div class="card controls"><label>Distribución<select id="dist"><option value="gamma">Gamma</option><option value="weibull">Weibull</option><option value="beta">Beta</option></select></label><label>Parámetro 1 <input id="p1" type="range" min="0.5" max="8" step="0.1" value="3"></label><label>Parámetro 2 <input id="p2" type="range" min="0.5" max="8" step="0.1" value="2"></label><label>Límite inferior <input id="a" type="range" min="0" max="8" step="0.1" value="1"></label><label>Límite superior <input id="b" type="range" min="0" max="8" step="0.1" value="3"></label><div class="stats" id="stats"></div></div><div class="card"><canvas id="cv" width="700" height="320"></canvas></div></div><script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dist=document.getElementById('dist'),p1=document.getElementById('p1'),p2=document.getElementById('p2'),aa=document.getElementById('a'),bb=document.getElementById('b'),stats=document.getElementById('stats');
function gamma(z){const g=7,p=[.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];if(z<.5)return Math.PI/(Math.sin(Math.PI*z)*gamma(1-z));z--;let x=p[0];for(let i=1;i<p.length;i++)x+=p[i]/(z+i);let t=z+g+.5;return Math.sqrt(2*Math.PI)*Math.pow(t,z+.5)*Math.exp(-t)*x}
function pdf(x){let u=+p1.value,v=+p2.value;if(dist.value==='gamma'){if(x<=0)return 0;return Math.pow(v,u)/gamma(u)*Math.pow(x,u-1)*Math.exp(-v*x)}if(dist.value==='weibull'){if(x<0)return 0;return u/v*Math.pow(x/v,u-1)*Math.exp(-Math.pow(x/v,u))}if(x<=0||x>=1)return 0;return Math.pow(x,u-1)*Math.pow(1-x,v-1)/(gamma(u)*gamma(v)/gamma(u+v))}
function simpson(f,a,b,n=400){if(b<=a)return 0;if(n%2)n++;let h=(b-a)/n,s=f(a)+f(b);for(let i=1;i<n;i++)s+=(i%2?4:2)*f(a+i*h);return s*h/3}
function draw(){let u=+p1.value,v=+p2.value,a=+aa.value,b=+bb.value;if(a>b)[a,b]=[b,a];let xmax=dist.value==='beta'?1:Math.max(8,b+1),xmin=0;let vals=[];for(let i=0;i<=500;i++){let x=xmin+(xmax-xmin)*i/500;vals.push([x,pdf(x)])}let ymax=Math.max(...vals.map(z=>z[1]),.001)*1.15;ctx.clearRect(0,0,cv.width,cv.height);ctx.beginPath();vals.forEach((z,i)=>{let px=40+(cv.width-60)*(z[0]-xmin)/(xmax-xmin),py=cv.height-30-(cv.height-50)*z[1]/ymax;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.beginPath();let sh=vals.filter(z=>z[0]>=a&&z[0]<=b);if(sh.length){ctx.moveTo(40+(cv.width-60)*(sh[0][0]-xmin)/(xmax-xmin),cv.height-30);sh.forEach(z=>ctx.lineTo(40+(cv.width-60)*(z[0]-xmin)/(xmax-xmin),cv.height-30-(cv.height-50)*z[1]/ymax));ctx.lineTo(40+(cv.width-60)*(sh[sh.length-1][0]-xmin)/(xmax-xmin),cv.height-30);ctx.closePath();ctx.globalAlpha=.2;ctx.fill();ctx.globalAlpha=1}let mean,varr,extra='';if(dist.value==='gamma'){mean=u/v;varr=u/(v*v);extra=`forma α=${u.toFixed(1)}, tasa λ=${v.toFixed(1)}`}else if(dist.value==='weibull'){mean=v*gamma(1+1/u);varr=v*v*(gamma(1+2/u)-Math.pow(gamma(1+1/u),2));extra=`forma k=${u.toFixed(1)}, escala η=${v.toFixed(1)}; tasa de falla ${u<1?'decreciente':u===1?'constante':'creciente'}`}else{mean=u/(u+v);varr=u*v/(Math.pow(u+v,2)*(u+v+1));extra=`α=${u.toFixed(1)}, β=${v.toFixed(1)}`;a=Math.min(a,1);b=Math.min(b,1)}let prob=simpson(pdf,Math.max(a,0),Math.min(b,xmax));stats.innerHTML=`${extra}<br>Media: <b>${mean.toFixed(4)}</b><br>Varianza: <b>${varr.toFixed(4)}</b><br>P(${a.toFixed(2)} ≤ X ≤ ${b.toFixed(2)}): <b>${prob.toFixed(4)}</b>`}
[dist,p1,p2,aa,bb].forEach(e=>e.addEventListener('input',draw));draw();
</script></body></html>
