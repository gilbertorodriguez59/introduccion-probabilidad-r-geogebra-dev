<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Distribuciones continuas</title><style>body{font-family:system-ui,Arial,sans-serif;margin:0;padding:18px;background:#f7f9fc;color:#1f2937}.card{max-width:900px;margin:auto;background:white;padding:18px;border-radius:14px;box-shadow:0 2px 12px #0001}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{font-weight:600;font-size:.9rem}input,select{width:100%}canvas{width:100%;height:360px;border:1px solid #dbe3ec;border-radius:10px;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px}.stat{padding:10px;background:#f1f5f9;border-radius:10px}</style></head><body><div class='card'><h2>Uniforme, exponencial y normal</h2><div class='row'><div><label>Distribución</label><select id='dist'><option value='unif'>Uniforme</option><option value='exp'>Exponencial</option><option value='norm'>Normal</option></select></div><div><label id='l1'>a</label><input id='p1' type='range' min='-5' max='5' step='.1' value='0'><span id='v1'></span></div><div><label id='l2'>b</label><input id='p2' type='range' min='.5' max='10' step='.1' value='5'><span id='v2'></span></div><div><label>Límite izquierdo</label><input id='c' type='range' min='-5' max='10' step='.1' value='1'><span id='vc'></span></div><div><label>Límite derecho</label><input id='d' type='range' min='-5' max='10' step='.1' value='3'><span id='vd'></span></div></div><canvas id='cv' width='900' height='360'></canvas><div class='stats'><div class='stat' id='mean'></div><div class='stat' id='var'></div><div class='stat' id='prob'></div><div class='stat' id='extra'></div></div></div><script>const $=id=>document.getElementById(id);const cv=$('cv'),ctx=cv.getContext('2d');function phi(z){return Math.exp(-.5*z*z)/Math.sqrt(2*Math.PI)}function erf(x){const s=x<0?-1:1;x=Math.abs(x);const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911,t=1/(1+p*x);return s*(1-((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-x*x))}function Phi(z){return .5*(1+erf(z/Math.sqrt(2)))}function updateLabels(){let d=$('dist').value;if(d==='unif'){$('l1').textContent='a';$('l2').textContent='b';$('p1').min=-5;$('p1').max=5;$('p2').min=.5;$('p2').max=10}else if(d==='exp'){$('l1').textContent='λ';$('l2').textContent='(sin uso)';$('p1').min=.05;$('p1').max=2;$('p1').value=.4;$('p2').value=1}else{$('l1').textContent='μ';$('l2').textContent='σ';$('p1').min=-3;$('p1').max=3;$('p1').value=0;$('p2').min=.2;$('p2').max=3;$('p2').value=1}}function draw(){const dist=$('dist').value,p1=+$('p1').value,p2=+$('p2').value;let c=+$('c').value,d=+$('d').value;if(c>d)[c,d]=[d,c];$('v1').textContent=' '+p1.toFixed(2);$('v2').textContent=' '+p2.toFixed(2);$('vc').textContent=' '+c.toFixed(2);$('vd').textContent=' '+d.toFixed(2);let xmin=-5,xmax=10,f,mean,v,prob,extra;if(dist==='unif'){let a=Math.min(p1,p2-.1),b=Math.max(p2,p1+.1);xmin=a-1;xmax=b+1;f=x=>(x>=a&&x<=b)?1/(b-a):0;mean=(a+b)/2;v=(b-a)**2/12;prob=Math.max(0,Math.min(d,b)-Math.max(c,a))/(b-a);extra='Longitud relativa del intervalo'}else if(dist==='exp'){let lam=Math.max(.05,p1);xmin=0;xmax=Math.max(10,6/lam);f=x=>x>=0?lam*Math.exp(-lam*x):0;mean=1/lam;v=1/(lam*lam);let cc=Math.max(c,0),dd=Math.max(d,0);prob=Math.max(0,Math.exp(-lam*cc)-Math.exp(-lam*dd));extra='P(X>x)=e^{-λx}'}else{let mu=p1,s=Math.max(.2,p2);xmin=mu-4*s;xmax=mu+4*s;f=x=>phi((x-mu)/s)/s;mean=mu;v=s*s;prob=Phi((d-mu)/s)-Phi((c-mu)/s);extra='z izq='+((c-mu)/s).toFixed(2)+', z der='+((d-mu)/s).toFixed(2)}$('mean').textContent='Media: '+mean.toFixed(4);$('var').textContent='Varianza: '+v.toFixed(4);$('prob').textContent='P(c<X<d): '+Math.max(0,prob).toFixed(4);$('extra').textContent=extra;ctx.clearRect(0,0,cv.width,cv.height);const xs=600;let ymax=0;for(let i=0;i<=xs;i++){let x=xmin+(xmax-xmin)*i/xs;ymax=Math.max(ymax,f(x))}ymax*=1.15;const X=x=>50+(x-xmin)/(xmax-xmin)*(cv.width-80),Y=y=>cv.height-40-y/ymax*(cv.height-70);ctx.strokeStyle='#64748b';ctx.beginPath();ctx.moveTo(50,Y(0));ctx.lineTo(cv.width-30,Y(0));ctx.stroke();ctx.fillStyle='rgba(100,116,139,.18)';ctx.beginPath();let started=false;for(let i=0;i<=xs;i++){let x=xmin+(xmax-xmin)*i/xs;if(x>=c&&x<=d){if(!started){ctx.moveTo(X(x),Y(0));started=true}ctx.lineTo(X(x),Y(f(x)))}}if(started){ctx.lineTo(X(Math.min(d,xmax)),Y(0));ctx.closePath();ctx.fill()}ctx.strokeStyle='#0f172a';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<=xs;i++){let x=xmin+(xmax-xmin)*i/xs,y=f(x);i?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))}ctx.stroke()}$('dist').addEventListener('change',()=>{updateLabels();draw()});['p1','p2','c','d'].forEach(id=>$(id).addEventListener('input',draw));updateLabels();draw();</script></body></html>
