<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventos y diagramas de Venn</title><style>body{font-family:system-ui;margin:0;padding:18px;background:#f8fafc;color:#172033}.box{max-width:900px;margin:auto;background:#fff;border:1px solid #dbe3ec;border-radius:12px;padding:16px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}button{padding:8px 12px;border:1px solid #9aa9b8;border-radius:8px;background:white;cursor:pointer}.stage{position:relative;height:340px;border:2px solid #64748b;border-radius:10px;overflow:hidden}.circle{position:absolute;width:260px;height:260px;border:3px solid #2563eb;border-radius:50%;top:38px}.a{left:160px}.b{left:350px;border-color:#dc2626}.shade{position:absolute;inset:0;pointer-events:none}.label{position:absolute;font-weight:700;font-size:24px}.la{left:235px;top:82px}.lb{left:495px;top:82px}.legend{margin-top:10px;color:#526173}</style></head><body><div class="box"><h2>Operaciones con eventos</h2><p>Selecciona una operación. La región sombreada representa el evento resultante.</p><div class="controls"><button data-op="union">A ∪ B</button><button data-op="inter">A ∩ B</button><button data-op="ac">Aᶜ</button><button data-op="bc">Bᶜ</button><button data-op="diff">A \ B</button><button data-op="clear">Limpiar</button></div><div class="stage" id="stage"><canvas class="shade" id="cv" width="900" height="340"></canvas><div class="circle a"></div><div class="circle b"></div><div class="label la">A</div><div class="label lb">B</div></div><div class="legend" id="txt">Espacio muestral S con dos eventos A y B.</div></div><script>const cv=document.getElementById('cv'),ctx=cv.getContext('2d');function inside(x,y,cx){return (x-cx)*(x-cx)+(y-168)*(y-168)<=130*130}function paint(op){const img=ctx.createImageData(cv.width,cv.height);for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++){const A=inside(x,y,290),B=inside(x,y,480);let z=false;if(op==='union')z=A||B;if(op==='inter')z=A&&B;if(op==='ac')z=!A;if(op==='bc')z=!B;if(op==='diff')z=A&&!B;if(z){const i=(y*cv.width+x)*4;img.data[i]=59;img.data[i+1]=130;img.data[i+2]=246;img.data[i+3]=70}}ctx.clearRect(0,0,cv.width,cv.height);if(op!=='clear')ctx.putImageData(img,0,0);const text={union:'A ∪ B: ocurre A, B o ambos.',inter:'A ∩ B: ocurren A y B simultáneamente.',ac:'Aᶜ: no ocurre A.',bc:'Bᶜ: no ocurre B.',diff:'A \\ B: ocurre A pero no B.',clear:'Espacio muestral S con dos eventos A y B.'};document.getElementById('txt').textContent=text[op]}document.querySelectorAll('button').forEach(b=>b.onclick=()=>paint(b.dataset.op));</script></body></html>
