<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMF y CDF discreta</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f8fafc;color:#172033;padding:18px}.panel{max-width:980px;margin:auto;background:#fff;border:1px solid #dbe3ec;border-radius:14px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.controls label{display:block;margin:12px 0}.controls input{width:100%}.card{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin:10px 0}canvas{width:100%;height:300px;border:1px solid #e2e8f0;border-radius:8px}.small{font-size:.92rem;color:#526173}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><div class="panel"><h2>Variable discreta: PMF y CDF</h2><p>Modifica pesos positivos para los valores X=0,1,2,3. El recurso normaliza automáticamente las masas para que sumen 1.</p><div class="grid"><div class="controls"><label>w0: <b id="v0"></b><input id="w0" type="range" min="0.01" max="2" step="0.01" value="0.2"></label><label>w1: <b id="v1"></b><input id="w1" type="range" min="0.01" max="2" step="0.01" value="0.5"></label><label>w2: <b id="v2"></b><input id="w2" type="range" min="0.01" max="2" step="0.01" value="0.8"></label><label>w3: <b id="v3"></b><input id="w3" type="range" min="0.01" max="2" step="0.01" value="0.5"></label><div class="card">PMF normalizada: <div id="pmf"></div></div><div class="card">CDF: <div id="cdf"></div></div></div><div><canvas id="c" width="900" height="300"></canvas><p class="small">Las barras representan pX(x). La línea escalonada representa FX(x). El tamaño de cada salto de la CDF es exactamente pX(x).</p></div></div></div><script>const ids=['w0','w1','w2','w3'],ins=ids.map(id=>document.getElementById(id)),c=document.getElementById('c'),ctx=c.getContext('2d');function u(){const w=ins.map(x=>+x.value),s=w.reduce((a,b)=>a+b,0),p=w.map(x=>x/s),F=[];p.reduce((a,b,i)=>(F[i]=a+b,a+b),0);p.forEach((x,i)=>document.getElementById('v'+i).textContent=w[i].toFixed(2));document.getElementById('pmf').textContent=p.map((x,i)=>`p(${i})=${x.toFixed(3)}`).join('   ');document.getElementById('cdf').textContent=F.map((x,i)=>`F(${i})=${x.toFixed(3)}`).join('   ');ctx.clearRect(0,0,c.width,c.height);const L=50,R=25,T=20,B=40,W=c.width-L-R,H=c.height-T-B;ctx.strokeStyle='#94a3b8';ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,T+H);ctx.lineTo(L+W,T+H);ctx.stroke();const xs=[0,1,2,3].map(i=>L+(i+0.5)*(W/4));p.forEach((v,i)=>{const h=v*H;ctx.fillStyle='#94a3b8';ctx.fillRect(xs[i]-24,T+H-h,48,h);ctx.fillStyle='#334155';ctx.fillText(String(i),xs[i]-4,T+H+20)});ctx.strokeStyle='#2563eb';ctx.lineWidth=3;ctx.beginPath();let prevX=L,prevY=T+H;for(let i=0;i<4;i++){const x=xs[i],y=T+H-F[i]*H;ctx.lineTo(x,prevY);ctx.lineTo(x,y);const next=(i<3?(xs[i]+xs[i+1])/2:L+W);ctx.lineTo(next,y);prevY=y}ctx.stroke();ctx.fillStyle='#334155';ctx.fillText('0',20,T+H+4);ctx.fillText('1',20,T+4)}ins.forEach(x=>x.addEventListener('input',u));u();</script></body></html>
