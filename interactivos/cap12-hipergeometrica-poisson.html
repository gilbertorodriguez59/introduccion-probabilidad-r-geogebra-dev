<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hipergeométrica y Poisson</title><style>body{font-family:system-ui;margin:18px;background:#f7f9fc;color:#172033}.card{background:white;border:1px solid #dbe3ec;border-radius:14px;padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{display:block;font-weight:600}input{width:100%}svg{width:100%;height:260px;background:#fff}.small{font-size:.9rem;color:#52606d}</style></head><body><div class="card"><h2>Hipergeométrica vs. binomial</h2><div class="grid"><label>N <span id="Nv"></span><input id="N" type="range" min="20" max="200" value="50"></label><label>K <span id="Kv"></span><input id="K" type="range" min="1" max="20" value="6"></label><label>n <span id="nv"></span><input id="n" type="range" min="2" max="20" value="8"></label></div><p id="hstats"></p><svg id="hplot"></svg></div><div class="card"><h2>Binomial vs. Poisson</h2><div class="grid"><label>n <span id="nbv"></span><input id="nb" type="range" min="10" max="500" value="100"></label><label>p <span id="pbv"></span><input id="pb" type="range" min="1" max="30" value="5"></label></div><p id="pstats"></p><svg id="pplot"></svg><p class="small">La aproximación Poisson mejora cuando n aumenta y p disminuye manteniendo λ=np moderado.</p></div><script>function fact(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r}function C(n,k){if(k<0||k>n)return 0;k=Math.min(k,n-k);let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r}function hyp(x,N,K,n){return C(K,x)*C(N-K,n-x)/C(N,n)}function bin(x,n,p){return C(n,x)*p**x*(1-p)**(n-x)}function pois(x,l){return Math.exp(-l)*l**x/fact(x)}function plot(svg,a,b,maxx){let W=700,H=240,m=28;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);let ymax=Math.max(...a,...b,.01),s='';for(let x=0;x<=maxx;x++){let X=m+(W-2*m)*(x/(Math.max(1,maxx)));let y1=H-m-(H-2*m)*a[x]/ymax,y2=H-m-(H-2*m)*b[x]/ymax;s+=`<line x1="${X-3}" y1="${H-m}" x2="${X-3}" y2="${y1}" stroke="currentColor" stroke-width="5"/><line x1="${X+3}" y1="${H-m}" x2="${X+3}" y2="${y2}" stroke="gray" stroke-width="5"/>`}s+=`<line x1="${m}" y1="${H-m}" x2="${W-m}" y2="${H-m}" stroke="black"/>`;svg.innerHTML=s}function updH(){let N=+NEl.value,K=+KEl.value,n=+nEl.value;K=Math.min(K,N-1);n=Math.min(n,N);Kv.textContent=K;Nv.textContent=N;nv.textContent=n;let p=K/N,maxx=Math.min(n,K+5),a=[],b=[];for(let x=0;x<=maxx;x++){a.push(hyp(x,N,K,n));b.push(bin(x,n,p))}hstats.textContent=`p=K/N=${p.toFixed(3)} · media=${(n*p).toFixed(3)} · fracción de muestreo n/N=${(n/N).toFixed(3)}`;plot(hplot,a,b,maxx)}function updP(){let n=+nb.value,p=+pb.value/100,l=n*p,maxx=Math.min(20,n),a=[],b=[];nbv.textContent=n;pbv.textContent=p.toFixed(2);for(let x=0;x<=maxx;x++){a.push(bin(x,n,p));b.push(pois(x,l))}pstats.textContent=`λ=np=${l.toFixed(3)} · barras oscuras: binomial · grises: Poisson`;plot(pplot,a,b,maxx)}const NEl=document.getElementById('N'),KEl=document.getElementById('K'),nEl=document.getElementById('n');[NEl,KEl,nEl].forEach(e=>e.oninput=updH);[nb,pb].forEach(e=>e.oninput=updP);updH();updP();</script></body></html>
