<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Variable aleatoria y CDF</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f8fafc;color:#172033;padding:18px}.panel{max-width:980px;margin:auto;background:#fff;border:1px solid #dbe3ec;border-radius:14px;padding:18px}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.card{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #e2e8f0;padding:7px;text-align:center}.bar{height:18px;background:#e2e8f0;border-radius:9px;overflow:hidden}.fill{height:100%;background:#2563eb}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><div class="panel"><h2>Variable aleatoria y función acumulada</h2><p>Selecciona una transformación sobre tres lanzamientos de moneda. Observa cómo varios resultados elementales pueden producir el mismo valor de X y cómo se acumula la probabilidad.</p><div class="controls"><label>Transformación: <select id="tipo"><option value="caras">Número de caras</option><option value="cambios">Número de cambios consecutivos</option><option value="almenos">Indicador de al menos una cara</option></select></label></div><div class="grid"><div class="card"><b>Resultados y valores</b><table><thead><tr><th>ω</th><th>X(ω)</th></tr></thead><tbody id="mapa"></tbody></table></div><div class="card"><b>Distribución de X</b><table><thead><tr><th>x</th><th>P(X=x)</th><th>F(x)</th></tr></thead><tbody id="dist"></tbody></table><div id="bars"></div></div></div></div><script>const oms=['CCC','CCS','CSC','CSS','SCC','SCS','SSC','SSS'];function val(o,t){if(t==='caras')return [...o].filter(x=>x==='C').length;if(t==='cambios')return (o[0]!==o[1]?1:0)+(o[1]!==o[2]?1:0);return o.includes('C')?1:0}function update(){const t=tipo.value,vs=oms.map(o=>val(o,t));mapa.innerHTML=oms.map((o,i)=>`<tr><td>${o}</td><td>${vs[i]}</td></tr>`).join('');const xs=[...new Set(vs)].sort((a,b)=>a-b);let ac=0;dist.innerHTML='';bars.innerHTML='';xs.forEach(x=>{const p=vs.filter(v=>v===x).length/8;ac+=p;dist.innerHTML+=`<tr><td>${x}</td><td>${p.toFixed(3)}</td><td>${ac.toFixed(3)}</td></tr>`;bars.innerHTML+=`<div style="margin:8px 0"><span>x=${x}: ${(p*100).toFixed(1)}%</span><div class="bar"><div class="fill" style="width:${p*100}%"></div></div></div>`})}tipo.addEventListener('change',update);update();</script></body></html>
